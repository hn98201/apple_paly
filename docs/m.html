<title>종배 모바일 대시보드</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<style>
  :root{
    --bg:#0a0e17; --card:#131a27; --card2:#0f1622; --line:#1e2a3a;
    --ink:#eaf1fb; --ink2:#aab8cc; --mut:#6b7a90;
    --up:#f0455c; --dn:#4c8df7; --gold:#f5b53d; --cyan:#38e7f2; --grn:#22c55e;
    --sans:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    --mono:"SF Mono",ui-monospace,"Consolas",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    padding:0 0 30px;line-height:1.45;font-size:15px;}
  .tnum{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  /* 상단 고정바 */
  .top{position:sticky;top:0;z-index:9;background:rgba(10,14,23,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:11px 16px;display:flex;align-items:center;gap:9px;}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
  .top .nm{font-weight:700;font-size:14px}
  .top .sp{flex:1}
  .top .st{font-size:11px;color:var(--ink2);display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
  .refresh{background:var(--card);border:1px solid var(--line);color:var(--cyan);border-radius:9px;
    width:34px;height:34px;font-size:16px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
  .refresh.spin{animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .wrap{padding:14px 14px 0;max-width:640px;margin:0 auto}
  /* 히어로 자산/손익 */
  .hero{background:linear-gradient(160deg,#16203150,#0f162200);border:1px solid var(--line);
    border-radius:18px;padding:18px 18px 16px;margin-bottom:12px}
  .hero .lb{font-size:12px;color:var(--mut)}
  .hero .eq{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:3px 0 2px}
  .hero .eq small{font-size:16px;color:var(--ink2);font-weight:600}
  .hero .pl{font-size:15px;font-weight:700;margin-top:4px}
  .hero .row{display:flex;gap:8px;margin-top:14px}
  .hero .row .b{flex:1;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .hero .row .b .k{font-size:11px;color:var(--mut)}
  .hero .row .b .v{font-size:15px;font-weight:700;margin-top:2px}
  /* 단계 배너 */
  .stage{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
  .stage b{color:var(--cyan)}
  /* 섹션 */
  .sec{margin-bottom:12px}
  .sh{display:flex;align-items:center;gap:7px;margin:0 2px 8px;font-size:13px;font-weight:700;color:var(--ink2)}
  .sh .cnt{font-size:11px;color:var(--mut);font-weight:600}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .empty{padding:20px;text-align:center;color:var(--mut);font-size:13px}
  /* 보유/픽 행 */
  .it{padding:12px 14px;border-bottom:1px solid var(--line)}
  .it:last-child{border-bottom:none}
  .it .r1{display:flex;align-items:baseline;gap:8px}
  .it .nm{font-weight:700;font-size:15px}
  .it .cd{font-size:11px;color:var(--mut);font-family:var(--mono)}
  .it .r1 .sp{flex:1}
  .it .big{font-size:16px;font-weight:800}
  .it .r2{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px;color:var(--ink2)}
  .it .r2 .sp{flex:1}
  .px{font-family:var(--mono);font-size:12.5px}
  .arr{color:var(--mut)}
  .badge{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;white-space:nowrap}
  .gA{background:#f0455c22;color:#ff7089;border:1px solid #f0455c55}
  .gB{background:#22c55e22;color:#4ade80;border:1px solid #22c55e55}
  .gC{background:#f5b53d22;color:#ffce6a;border:1px solid #f5b53d55}
  .gD{background:#4c8df722;color:#7db0ff;border:1px solid #4c8df755}
  .th{font-size:10.5px;font-weight:700;color:#241a06;background:var(--gold);padding:2px 7px;border-radius:999px}
  .tagbuy{font-size:10px;font-weight:700;color:var(--grn);border:1px solid #22c55e66;padding:1px 6px;border-radius:6px}
  .tagup{font-size:10px;font-weight:700;color:var(--gold);border:1px solid #f5b53d66;padding:1px 6px;border-radius:6px}
  .tagwait{font-size:10px;color:var(--mut);border:1px solid var(--line);padding:1px 6px;border-radius:6px}
  /* disposition 라벨 */
  .dtag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:7px;white-space:nowrap}
  .tag-buy{color:#04121a;background:var(--grn)}
  .tag-sel{color:#04121a;background:var(--cyan)}
  .tag-none{color:var(--mut);border:1px solid var(--line)}
  .tag-flt{color:#7db0ff;border:1px solid #4c8df766}
  .card.scroll{max-height:340px;overflow-y:auto}
  .tr .dt{font-family:var(--mono);font-size:10px;color:var(--mut);width:38px;flex:none;text-align:right}
  .tr .rz{min-width:74px;text-align:right;font-weight:700}
  /* 날짜 그룹(매매기록) */
  .dgrp{padding:8px 14px 3px;font-family:var(--mono);font-size:11.5px;color:var(--cyan);font-weight:700;
    border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
  .dgrp .dp{font-family:var(--mono)}
  /* 섹터 */
  .airc{background:linear-gradient(160deg,#2ec6d618,#2ec6d600);border:1px solid #2ec6d555;border-radius:12px;
    padding:12px 14px;font-size:13px;line-height:1.65;white-space:pre-wrap;color:var(--ink2);margin-bottom:10px}
  .airc:empty{display:none}
  .sumc{font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:12px}
  .sumc:empty{display:none}
  .secrow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid var(--line)}
  .secrow:last-child{border-bottom:none}
  .secrk{font-family:var(--mono);font-size:11px;color:var(--mut);width:20px;text-align:center;flex:none}
  .secbar{width:70px;height:6px;background:var(--card2);border-radius:3px;overflow:hidden;flex:none}
  .secbf{height:100%;border-radius:3px}
  .secnm{font-weight:600;font-size:13.5px} .secx{flex:1;min-width:0}
  .secchg{font-family:var(--mono);font-size:13px;font-weight:700;width:56px;text-align:right;flex:none}
  .secmeta{font-size:10.5px;color:var(--mut);margin-top:2px}
  .secbn{font-size:10px;font-weight:700;color:#241a06;background:var(--gold);padding:1px 6px;border-radius:6px;margin-left:6px}
  .secstk{font-size:10.5px;color:var(--cyan);margin-top:3px}
  /* 시스템 그리드 */
  .sys{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sys .b{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px}
  .sys .b .k{font-size:11px;color:var(--mut)}
  .sys .b .v{font-size:13.5px;font-weight:700;margin-top:2px}
  .cfg{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .cfg span{font-size:11px;color:var(--ink2);background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
  /* 체결 */
  .tr{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
  .tr:last-child{border-bottom:none}
  .tr .tm{font-family:var(--mono);font-size:11px;color:var(--mut);flex:none;width:42px}
  .tr .sp{flex:1}
  .foot{text-align:center;color:var(--mut);font-size:11px;padding:14px 10px 0;line-height:1.7}
  .err{background:#4c8df71a;border:1px solid #4c8df755;color:#9cc2ff;border-radius:12px;padding:11px 14px;margin-bottom:12px;font-size:12.5px;display:none}
  .up{color:var(--up)} .dn{color:var(--dn)} .flat{color:var(--ink2)}
  /* 비밀번호 게이트 */
  .gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;
    align-items:center;justify-content:center;padding:30px;text-align:center}
  .gate.on{display:flex}
  .gate .lock{font-size:44px;margin-bottom:6px}
  .gate h2{margin:0 0 4px;font-size:20px}
  .gate p{color:var(--mut);font-size:13px;margin:0 0 22px}
  .gate input{width:100%;max-width:280px;background:var(--card);border:1px solid var(--line);
    color:var(--ink);border-radius:12px;padding:14px 16px;font-size:17px;text-align:center;outline:none}
  .gate input:focus{border-color:var(--cyan)}
  .gate button{width:100%;max-width:280px;margin-top:12px;background:var(--cyan);color:#04121a;
    border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:800;cursor:pointer}
  .gate .msg{color:var(--up);font-size:13px;min-height:18px;margin-top:12px}
  .gate label{display:flex;align-items:center;gap:7px;justify-content:center;margin-top:14px;color:var(--ink2);font-size:13px}
</style>

<div class="gate" id="gate">
  <div class="lock">🔒</div>
  <h2>종배 대시보드</h2>
  <p>비밀번호를 입력하세요</p>
  <input id="pwInput" type="password" inputmode="text" placeholder="비밀번호" autocomplete="current-password"
    onkeydown="if(event.key==='Enter')unlock()">
  <button onclick="unlock()">열기</button>
  <label><input type="checkbox" id="remember" checked> 이 기기에 기억</label>
  <div class="msg" id="gateMsg"></div>
</div>

<div class="top">
  <span class="dot" id="connDot" style="color:var(--grn)"></span>
  <span class="nm">종배 대시보드</span>
  <span class="sp"></span>
  <span class="st"><span id="stTop">모의 · 자동 ON</span><span id="ago">— 전</span></span>
  <button class="refresh" id="rfBtn" onclick="pull(true)">↻</button>
</div>

<div class="wrap">
  <div class="err" id="err"></div>

  <div class="hero">
    <div class="lb">전략자산 (복리)</div>
    <div class="eq tnum" id="eq">—</div>
    <div class="pl tnum" id="todayPl">—</div>
    <div class="row">
      <div class="b"><div class="k">평가손익(보유)</div><div class="v tnum" id="unreal">—</div></div>
      <div class="b"><div class="k">실현손익(오늘)</div><div class="v tnum" id="real">—</div></div>
    </div>
  </div>

  <div class="stage"><span>📍</span><span id="stage">—</span></div>

  <div class="sec">
    <div class="sh">💼 보유 종목 <span class="cnt" id="posCnt"></span></div>
    <div class="card" id="posCard"><div class="empty">보유 종목 없음</div></div>
  </div>

  <div class="sec">
    <div class="sh">🎯 오늘 스캔 종목 <span class="cnt" id="pickCnt"></span></div>
    <div class="card" id="pickCard"><div class="empty">스캔 전 (15:20 자동스캔)</div></div>
  </div>

  <div class="sec" id="secSec" style="display:none">
    <div class="sh">🔥 오늘 강한 섹터/테마 <span class="cnt" id="secCnt"></span></div>
    <div class="airc" id="secAi"></div>
    <div class="sumc" id="secSum"></div>
    <div id="secList"></div>
  </div>

  <div class="sec">
    <div class="sh">🛠️ 시스템 상태</div>
    <div class="sys">
      <div class="b"><div class="k">키움 접속</div><div class="v" id="sConn">—</div></div>
      <div class="b"><div class="k">자동매매</div><div class="v" id="sAuto">—</div></div>
      <div class="b"><div class="k">실시간 감시</div><div class="v" id="sReal">—</div></div>
      <div class="b"><div class="k">조건검색</div><div class="v" id="sCond">—</div></div>
    </div>
    <div class="cfg" id="cfg"></div>
  </div>

  <div class="sec" id="trSec" style="display:none">
    <div class="sh">🧾 매매 기록 <span class="cnt" id="trCnt"></span></div>
    <div class="card" id="trCard"></div>
  </div>

  <div class="foot" id="foot">데이터 대기중…</div>
  <div style="text-align:center;padding-top:10px"><a onclick="logout()" style="color:var(--mut);font-size:11px;cursor:pointer;text-decoration:underline">🔓 비밀번호 변경 / 로그아웃</a></div>
</div>

<script>

      {name:"반도체와반도체장비", chg:0.71, up:90, down:60, total:172, accel:6, bonus:5, stocks:[{name:"반도체소부장",score:66,disp:"투자금부족"}]},

  function won(n){
    if(n==null) return "—";
    var a=Math.abs(n), s=n<0?"-":"";
    if(a>=1e8) return s+(a/1e8).toFixed(2).replace(/\.00$/,"")+"억";
    if(a>=1e4) return s+Math.round(a/1e4).toLocaleString()+"만";
    return s+Math.round(a).toLocaleString();
  }
  function wonFull(n){ return (n==null)?"—":(n<0?"-":"")+Math.abs(Math.round(n)).toLocaleString()+"원"; }
  function sign(n){ return (n>0?"+":"")+n; }
  function cls(n){ return n>0?"up":(n<0?"dn":"flat"); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

  function render(d){
    lastData=d;
    // 상단
    var cd=document.getElementById("connDot");
    cd.style.color = d.conn ? "var(--grn)" : "var(--up)";
    document.getElementById("stTop").textContent = (d.is_mock?"모의":"실전")+" · 자동 "+(d.enabled?"ON":"OFF");
    // 히어로
    document.getElementById("eq").innerHTML = won(d.equity)+' <small>원</small>';
    var p=d.pnl||{}, t=p.total||0;
    var pe=document.getElementById("todayPl");
    pe.className="pl tnum "+cls(t);
    pe.textContent = "오늘 "+(t>=0?"+":"")+wonFull(t).replace("원","")+"원 ("+(p.acct_ret>=0?"+":"")+(p.acct_ret||0).toFixed(2)+"%)";
    var ur=document.getElementById("unreal"); ur.className="v tnum "+cls(p.unrealized||0); ur.textContent=(p.unrealized>=0?"+":"")+won(p.unrealized||0);
    var rl=document.getElementById("real"); rl.className="v tnum "+cls(p.realized||0); rl.textContent=(p.realized>=0?"+":"")+won(p.realized||0);
    // 단계
    document.getElementById("stage").innerHTML = "<b>"+esc(d.stage||"—")+"</b>  ("+esc(d.hm||"")+")";
    // 보유
    var pc=document.getElementById("posCard"), pos=d.positions||[];
    document.getElementById("posCnt").textContent = pos.length?pos.length+"종목":"";
    if(!pos.length){ pc.innerHTML='<div class="empty">보유 종목 없음</div>'; }
    else{
      pc.innerHTML = pos.map(function(o){
        var c=cls(o.ret);
        return '<div class="it"><div class="r1"><span class="nm">'+esc(o.name)+'</span><span class="cd">'+esc(o.code)+'</span>'
          +(o.upper?' <span class="tagup">상한</span>':'')+'<span class="sp"></span>'
          +'<span class="big '+c+'">'+sign((o.ret||0).toFixed(2))+'%</span></div>'
          +'<div class="r2"><span class="px">'+ (o.buy||0).toLocaleString() +' <span class="arr">→</span> '+ (o.cur||0).toLocaleString() +'</span>'
          +'<span class="mut"> · '+ (o.qty||0) +'주</span><span class="sp"></span>'
          +'<span class="'+c+'" style="font-weight:700">'+(o.pl>=0?"+":"")+wonFull(o.pl).replace("원","")+'원</span></div></div>';
      }).join("");
    }
    // 오늘 스캔 종목(전체) — disposition 라벨(매수/선정/투자금부족/상한가/필터제외)
    var kc=document.getElementById("pickCard"), pk=d.picks||[];
    var DMAP={"매수":["매수","tag-buy"],"선정":["선정","tag-sel"],"상한가선정":["상한가→시가매수","tag-up"],
              "투자금부족":["투자금부족","tag-none"],"상한가":["상한가제외","tag-up"],"필터제외":["필터제외","tag-flt"]};
    var nbuy=pk.filter(function(s){return s.disp==="매수"||s.disp==="선정"||s.disp==="상한가선정";}).length;
    var pstat = d.scan_state==="prev"?" · 직전 스캔(유지중)":"";
    document.getElementById("pickCnt").textContent = pk.length?(esc(d.picks_date||"")+" "+esc(d.picks_time||"")+" · "+pk.length+"종목 · 선정 "+nbuy+pstat):"";
    if(!pk.length){
      kc.className="card";
      kc.innerHTML='<div class="empty">'+(d.scan_state==="none"?"📭 오늘 스캔종목 없음<br><span style=\"font-size:11px\">다음날 15:00 등록해제 · 15:20 자동스캔 등록</span>":"스캔 전 (15:20 자동스캔)")+'</div>';
    } else {
      kc.className = pk.length>7?"card scroll":"card";
      kc.innerHTML = pk.map(function(s){
        var g=s.grade||"D"; var dd=DMAP[s.disp]||[s.disp||"-","tag-none"];
        return '<div class="it"><div class="r1"><span class="nm">'+esc(s.name)+'</span><span class="cd">'+esc(s.code)+'</span><span class="sp"></span><span class="dtag '+dd[1]+'">'+dd[0]+'</span></div>'
          +'<div class="r2"><span class="badge g'+g+'">'+g+' '+(s.score!=null?s.score:"—")+'</span>'
          +(s.theme_bonus>0?'<span class="th">⭐'+esc(s.theme)+'+'+s.theme_bonus+'</span>':(s.theme?'<span class="tagwait">'+esc(s.theme)+'</span>':''))
          +'<span class="sp"></span><span class="px">'+(s.entry||0).toLocaleString()+'원</span>'
          +'<span class="'+cls(s.chg)+'"> '+sign((s.chg||0).toFixed(1))+'%</span></div></div>';
      }).join("");
    }
    // 시스템
    function ynv(el,ok,okt,not){ var e=document.getElementById(el); e.className="v "+(ok?"up":"dn"); e.textContent=ok?okt:not; }
    ynv("sConn", d.conn, "✅ 정상", "❌ 끊김");
    ynv("sAuto", d.enabled, "🟢 ON", "⚪ OFF");
    ynv("sReal", d.real_on, "👁 "+((d.positions||[]).length)+"종목", "—");
    var sc=document.getElementById("sCond"); sc.className="v flat"; sc.textContent=esc(d.cond_ok||"—");
    document.getElementById("cfg").innerHTML =
      '<span>익절 '+d.tp+'%</span><span>손절 '+d.sl+'%</span><span>종목당 '+won(d.invest)+'</span>'
      +'<span>매수 '+d.af+'종목</span><span>유통≤'+d.float_max+'%</span>'
      +'<span>상한'+(d.exclude_upper?"제외":"포함")+'</span><span>테마+'+d.theme_bonus_max+'</span>';
    // 오늘 강한 섹터/테마 + 종목랭크 + 리서치 요약
    var sec=d.sectors||[], ss=document.getElementById("secSec");
    if(sec.length){ ss.style.display="block";
      document.getElementById("secCnt").textContent = d.sector_date? esc(d.sector_date) : "";
      var tm=d.thememap||{}, aih="";
      if(tm.summary || (tm.strong&&tm.strong.length)){
        aih='<div style="font-weight:700;color:var(--cyan);margin-bottom:6px">🗺️ 앤트위키 테마맵'+(tm.ts?' <span style="color:var(--mut);font-weight:400;font-size:11px">'+esc(tm.ts)+'</span>':'')+'</div>';
        (tm.strong||[]).forEach(function(r){
          aih+='<div style="margin-bottom:3px"><span class="up" style="font-weight:700">▲ '+esc(r.name)+' '+esc(r.chg)+'</span>'
            +((r.subs&&r.subs.length)?' <span style="color:var(--ink2);font-size:12px">'+esc(r.subs.join(" · "))+'</span>':'')+'</div>';
        });
        if(tm.weak&&tm.weak.length) aih+='<div style="margin-top:4px"><span class="dn" style="font-weight:700">▼ 약세</span> <span style="color:var(--ink2);font-size:12px">'+tm.weak.map(function(r){return esc(r.name)+" "+esc(r.chg);}).join(" · ")+'</span></div>';
      }
      document.getElementById("secAi").innerHTML = aih;
      document.getElementById("secSum").innerHTML = d.sector_summary? esc(d.sector_summary) : "";
      var smax = Math.max.apply(null, sec.map(function(s){return Math.abs(s.chg);})) || 1;
      document.getElementById("secList").innerHTML = sec.map(function(s,i){
        var c = s.chg>0?"up":(s.chg<0?"dn":"flat");
        var stk = (s.stocks&&s.stocks.length)? '<div class="secstk">📌 '+s.stocks.map(function(x){return esc(x.name)+"("+(x.score!=null?x.score:"—")+")";}).join(", ")+'</div>' : '';
        return '<div class="secrow"><div class="secrk">'+(i+1)+'</div>'
          +'<div class="secbar"><div class="secbf" style="width:'+(Math.abs(s.chg)/smax*100)+'%;background:'+(s.chg>=0?"var(--up)":"var(--dn)")+'"></div></div>'
          +'<div class="secx"><span class="secnm">'+esc(s.name)+'</span>'+(s.bonus>0?'<span class="secbn">가점+'+s.bonus+'</span>':'')
          +'<div class="secmeta">상승 '+s.up+'/'+s.total+(s.accel>=3?' · 🚀오후가속+'+s.accel:'')+'</div>'+stk+'</div>'
          +'<div class="secchg '+c+'">'+(s.chg>=0?"+":"")+s.chg.toFixed(2)+'%</div></div>';
      }).join("");
    } else ss.style.display="none";

    // 매매 기록 — 날짜별 그룹, 각 날짜 내 청산시간 내림차순
    var tr=d.trades||[], ts=document.getElementById("trSec");
    if(tr.length){ ts.style.display="block"; document.getElementById("trCnt").textContent=tr.length+"건";
      var tc=document.getElementById("trCard"); tc.className=tr.length>8?"card scroll":"card";
      var byd={}, order=[];
      tr.forEach(function(t){ var dd=t.date||"—"; if(!byd[dd]){byd[dd]=[];order.push(dd);} byd[dd].push(t); });
      order.sort(function(a,b){return b.localeCompare(a);});          // 최신 날짜 먼저
      var html="";
      order.forEach(function(dd){
        var rows=byd[dd].slice().sort(function(a,b){return (b.time||"").localeCompare(a.time||"");});
        var dsum=rows.reduce(function(a,t){return a+(t.pl||0);},0);
        var wn=rows.filter(function(t){return (t.reason||"").indexOf("익절")>=0;}).length;
        html += '<div class="dgrp"><span class="dp">'+esc(dd)+' <span style="color:var(--mut)">·'+rows.length+'건 익'+wn+'</span></span><span class="'+cls(dsum)+'">'+(dsum>=0?"+":"")+wonFull(dsum).replace("원","")+'원</span></div>';
        html += rows.map(function(t){
          return '<div class="tr"><span class="dt">'+esc(t.time||"")+'</span><span>'+esc(t.name)+'</span><span class="sp"></span>'
            +'<span class="'+cls(t.ret)+'" style="font-size:12px">'+esc(t.reason||"")+' '+sign((t.ret||0).toFixed(1))+'%</span>'
            +'<span class="rz '+cls(t.pl)+'">'+(t.pl>=0?"+":"")+wonFull(t.pl).replace("원","")+'</span></div>';
        }).join("");
      });
      tc.innerHTML = html;
    } else ts.style.display="none";
    // footer
    lastTs = Date.parse((d.ts||"").replace(" ","T"))||Date.now();
    document.getElementById("foot").innerHTML = "서버 "+esc(d.server||"")+" · 계좌 "+esc(d.account_mask||"")+(d.is_mock?" (모의)":"")
      +"<br>갱신 "+esc(d.ts||"")+" · "+POLL/1000+"초마다 자동새로고침";
    tickAgo();
  }

  function tickAgo(){
    var s=Math.max(0,Math.round((Date.now()-lastTs)/1000));
    var t = s<60? s+"초 전" : Math.floor(s/60)+"분 "+(s%60)+"초 전";
    document.getElementById("ago").textContent = t;
  }

  // ── 비밀번호 복호화(Web Crypto, 서버 mcrypt.py와 호환) ──
  var pw=null; try{ pw=localStorage.getItem("mpw"); }catch(e){}
  function b64(s){ return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0);}); }
  async function decrypt(env, password){
    var salt=b64(env.salt), nonce=b64(env.nonce), ct=b64(env.ct), tag=b64(env.tag);
    var base=await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"]);
    var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:env.iter,hash:"SHA-256"}, base, 512));
    var encKey=bits.slice(0,32), macKey=bits.slice(32,64);
    var macCK=await crypto.subtle.importKey("raw", macKey, {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
    var macData=new Uint8Array(salt.length+nonce.length+ct.length);
    macData.set(salt,0); macData.set(nonce,salt.length); macData.set(ct,salt.length+nonce.length);
    var calc=new Uint8Array(await crypto.subtle.sign("HMAC", macCK, macData));
    if(calc.length!==tag.length || !calc.every(function(b,i){return b===tag[i];})) throw new Error("BADPW");
    var encCK=await crypto.subtle.importKey("raw", encKey, {name:"HMAC",hash:"SHA-256"}, false, ["sign"]);
    var nb=Math.ceil(ct.length/32);
    var blocks=await Promise.all(Array.from({length:nb}, function(_,i){
      var c=new Uint8Array(4); new DataView(c.buffer).setUint32(0,i,false);
      var inp=new Uint8Array(nonce.length+4); inp.set(nonce,0); inp.set(c,nonce.length);
      return crypto.subtle.sign("HMAC", encCK, inp);
    }));
    var ks=new Uint8Array(nb*32); blocks.forEach(function(b,i){ks.set(new Uint8Array(b), i*32);});
    var pt=new Uint8Array(ct.length); for(var i=0;i<ct.length;i++) pt[i]=ct[i]^ks[i];
    return JSON.parse(new TextDecoder().decode(pt));
  }
  function showGate(msg){ document.getElementById("gate").classList.add("on");
    document.getElementById("gateMsg").textContent=msg||"";
    setTimeout(function(){ try{document.getElementById("pwInput").focus();}catch(e){} },100); }
  function unlock(){ var v=document.getElementById("pwInput").value; if(!v) return; pw=v;
    try{ if(document.getElementById("remember").checked) localStorage.setItem("mpw",v); else localStorage.removeItem("mpw"); }catch(e){}
    document.getElementById("gate").classList.remove("on"); document.getElementById("pwInput").value=""; pull(true); }
  function logout(){ try{localStorage.removeItem("mpw");}catch(e){} pw=null; showGate("비밀번호를 다시 입력하세요"); }

  function pull(manual){
    var btn=document.getElementById("rfBtn"); if(manual) btn.classList.add("spin");
    fetch(RAW+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status); return r.json();
    }).then(function(env){
      if(!pw){ showGate(""); throw {gate:true}; }
      return decrypt(env, pw).then(function(d){
        document.getElementById("err").style.display="none"; render(d);
      }).catch(function(e){ showGate("❌ 비밀번호가 틀렸습니다"); throw {gate:true}; });
    }).catch(function(e){
      if(e && e.gate) return;
      if(!lastData){ render(SAMPLE);
        var er=document.getElementById("err"); er.style.display="block";
        er.innerHTML="⚠️ 실시간 데이터 미연결 — <b>샘플 미리보기</b>.<br>배포(GitHub) + 서버 push 후 실데이터가 뜹니다.";
      }
    }).finally(function(){ if(manual) setTimeout(function(){btn.classList.remove("spin");},600); });
  }

  pull(false);
  setInterval(function(){ if(pw) pull(false); }, POLL);
  setInterval(tickAgo, 1000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden && pw) pull(false); });
</script>
